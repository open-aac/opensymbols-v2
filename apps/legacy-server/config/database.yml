default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/opensymbols-development") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/opensymbols-test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
